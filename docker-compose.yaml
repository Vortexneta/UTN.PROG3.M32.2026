services:
  node-dev:
    image: node:24-slim
    container_name: prog3_node
    working_dir: /app
    volumes:
      - ./app:/app
    # Mapeo de puertos preparado para cuando usemos Expo (8081)
    ports:
      - "8081:8081"
      - "19000:19000"
    # Mantiene el contenedor con una terminal interactiva (equivalente a -it)
    stdin_open: true
    tty: true